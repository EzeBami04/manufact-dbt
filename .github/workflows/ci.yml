name: Test DBT models
on:
    push:
        branches: ['main']
    pull_request:
        branches: ['main']
jobs:
    python-app:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6 
            - name: set up python
              uses: actions/setup-python@v6
              with:
                "python-version": '3.12'
            - name:
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
    dbt-test:
        needs: python-app
        runs-on: ubuntu-latest